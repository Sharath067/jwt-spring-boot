<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <style>
        body { font-family: Arial; background:#f4f4f4; padding:20px; }
        .card {
            background:white;
            max-width:500px;
            margin:auto;
            padding:30px;
            border-radius:8px;
        }
        h2 { color:#0b5ed7; }
        .btn {
            display:inline-block;
            padding:10px 20px;
            background:#0b5ed7;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Welcome, <span th:text="${name}"></span> </h2>

    <p>Your account has been successfully created at <b>Winz Ecommerce</b>.</p>

    <p>Email: <b th:text="${email}"></b></p>

    <p>You can now login and start shopping.</p>

    <a class="btn" href="http://192.168.0.115:5173/">Login Now</a>

    <p style="margin-top:30px">
        Regards,<br>
        <b>Winz Team</b>
    </p>
</div>
</body>
</html>
